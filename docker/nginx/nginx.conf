user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The exact nginx version in the Server header is free reconnaissance:
    # it points an attacker straight at the advisories for this build.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate-limit zones. Declared here because a zone must live in the http
    # context; the locations that use them are in conf.d/default.conf.
    #
    # $binary_remote_addr, not a forwarded header: nginx is the edge, so this is
    # the real peer address and nothing a client sends can change it.
    #
    # admin_login guards the AdminJS form. That panel is mounted straight onto
    # the raw Fastify instance, so it never passes through the application's
    # throttler guard — before this, its single static account could be
    # brute-forced at full speed.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

    # assistant guards the endpoint that spends money on LLM calls. Deliberately
    # looser than the application's own per-visitor limit (10/min) so the app
    # stays the authority on quota and answers a well-formed 429; this only
    # catches floods that should never reach Node at all.
    limit_req_zone $binary_remote_addr zone=assistant:10m rate=30r/m;

    # 503 is the nginx default and reads as "the service broke". A throttled
    # caller should be told to back off instead.
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
