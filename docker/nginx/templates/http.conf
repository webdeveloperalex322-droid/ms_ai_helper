# HTTP entrypoint. Serves the app directly and keeps the ACME webroot open so
# certbot can (re)issue certificates. scripts/enable-ssl.sh rewrites this file
# into the redirect-to-HTTPS form once a certificate exists.
#
# No Strict-Transport-Security here on purpose: it is only meaningful, and only
# honoured, over HTTPS. The HTTPS form written by enable-ssl.sh sets it.
server {
    listen 80 default_server;
    server_name mshelper.al-developer.ru _;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Brute-force guard for the AdminJS login form. The panel bypasses the
    # application's throttler guard entirely, so this is its only rate limit.
    location = /admin/login {
        limit_req zone=admin_login burst=5 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Flood guard for the endpoint that spends money on LLM calls.
    location = /v1/assistant/product-answer {
        limit_req zone=assistant burst=10 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never $proxy_add_x_forwarded_for: that form appends to
        # whatever the client sent, so a caller could prepend any address it
        # liked and the app would read it as the client's own. Overwriting drops
        # the forged part at the edge, leaving exactly one trustworthy entry —
        # which is what trustProxy: 1 in main.ts expects to find.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
