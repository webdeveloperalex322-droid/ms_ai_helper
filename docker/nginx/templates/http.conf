# HTTP entrypoint. Serves the app directly and keeps the ACME webroot open so
# certbot can (re)issue certificates. scripts/enable-ssl.sh rewrites this file
# into the redirect-to-HTTPS form once a certificate exists.
server {
    listen 80 default_server;
    server_name mshelper.al-developer.ru _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
