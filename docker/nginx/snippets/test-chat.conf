# Password-protected test chat (test-client/index.html) on the prod domain.
# Included from the HTTPS server block only: Basic Auth over plain HTTP would
# send the password in the clear.
#
# The page calls /test-chat/api/*, which nginx forwards to the app's /v1/* with
# a dedicated client key injected server-side. Same origin, so prod CORS never
# comes into play, and the key never reaches the browser.
#
# Server state, never shipped in the deploy archive (docker/nginx/secrets/):
#   test-chat.htpasswd   Basic Auth users (openssl passwd -apr1)
#   test-chat-key.conf   set $test_chat_key "<key from CLIENT_API_KEYS, label testchat>";
# Without the key file the API answers 401; without htpasswd nginx answers 500.

location = /test-chat {
    return 301 /test-chat/;
}

# Only index.html is served — the rest of test-client/ (README, the local
# proxy script) is not exposed.
location = /test-chat/ {
    auth_basic "AI Assistant test chat";
    auth_basic_user_file /etc/nginx/secrets/test-chat.htpasswd;
    # Slows down password guessing; a human reloading the page never hits it.
    limit_req zone=admin_login burst=5 nodelay;

    # Not alias: a URI ending in "/" makes nginx treat an aliased file as a
    # directory and fail with 500.
    root /usr/share/nginx;
    try_files /test-chat/index.html =404;
    charset utf-8;
}

location /test-chat/api/ {
    auth_basic "AI Assistant test chat";
    auth_basic_user_file /etc/nginx/secrets/test-chat.htpasswd;
    limit_req zone=assistant burst=10 nodelay;

    set $test_chat_key "";
    # Glob, so a server without the key file still starts (requests get 401).
    include /etc/nginx/secrets/test-chat-key*.conf;

    proxy_pass http://app:3000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replaces whatever key the page sent.
    proxy_set_header X-API-Key $test_chat_key;
    # The browser's Basic Auth credentials are for nginx, not the app.
    proxy_set_header Authorization "";
    proxy_read_timeout 60s;
}
