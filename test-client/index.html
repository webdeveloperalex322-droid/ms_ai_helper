<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant — тестовый чат</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff; --user: #2d5bd7;
    --assistant: #232833; --err: #3a1d22; --err-bd: #a3384a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }

  /* Settings */
  header { background: var(--panel); border-bottom: 1px solid var(--border); }
  .settings-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; cursor: pointer; user-select: none;
  }
  .settings-head h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .settings-head .status { font-size: 12px; color: var(--muted); }
  .settings-body {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px;
    padding: 0 16px 14px; max-height: 500px; overflow: hidden;
    transition: max-height .2s, padding .2s;
  }
  .settings-body.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

  /* Chat */
  main { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant, .row.system { justify-content: flex-start; }
  .bubble {
    max-width: 78%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .system .bubble { background: var(--err); border: 1px solid var(--err-bd); color: #ffd5db; font-size: 13px; }

  .clarify { margin-top: 8px; color: #ffe08a; font-size: 13px; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .card {
    display: flex; gap: 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; align-items: center;
  }
  .card img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .card .noimg { width: 54px; height: 54px; border-radius: 8px; background: #000; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; flex: none; }
  .card .c-body { flex: 1; min-width: 0; }
  .card .c-name { font-weight: 600; font-size: 13px; }
  .card .c-price { color: var(--accent); font-size: 13px; margin: 2px 0; }
  .card .c-reason { color: var(--muted); font-size: 12px; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: var(--accent); color: #fff; }
  .chip.preset { border-color: #6bd08a; color: #6bd08a; }
  .chip.preset:hover { background: #6bd08a; color: #072; }

  details.debug { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details.debug pre { background: #0b0d11; border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: auto; max-height: 260px; }

  /* input */
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px; }
  .preset-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .input-row { display: flex; gap: 8px; }
  .input-row textarea {
    flex: 1; resize: none; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; max-height: 120px;
  }
  .input-row textarea:focus { outline: none; border-color: var(--accent); }
  button.send, button.ghost {
    border-radius: 10px; padding: 0 18px; font-size: 14px; cursor: pointer; font-family: inherit; border: none;
  }
  button.send { background: var(--accent); color: #fff; font-weight: 600; }
  button.send:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 6px 12px; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <header>
    <div class="settings-head" id="settingsToggle">
      <h1>🍣 AI Assistant — тестовый чат</h1>
      <span class="status" id="settingsStatus"></span>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="field full">
        <label for="baseUrl">Base URL (адрес API)</label>
        <input id="baseUrl" type="text" placeholder="http://localhost:4000/v1" />
      </div>
      <div class="field full">
        <label for="apiKey">X-API-Key — клиентский ключ доступа</label>
        <input id="apiKey" type="text" placeholder="dev-client-key-change-in-prod" />
      </div>
      <div class="field full">
        <label for="br">br — филиал (branch id)</label>
        <input id="br" type="text" />
      </div>
      <div class="field">
        <label for="rn">rn — retail network</label>
        <input id="rn" type="text" />
      </div>
      <div class="field">
        <label for="target">target</label>
        <select id="target">
          <option value="WEB">WEB</option>
          <option value="MOBILE">MOBILE</option>
        </select>
      </div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="preset-row">
      <button class="ghost" id="loadPresets">Загрузить пресеты</button>
      <button class="ghost" id="clearChat">Очистить чат</button>
      <span class="status" id="presetStatus"></span>
    </div>
    <div class="input-row">
      <textarea id="msg" rows="1" placeholder="Напиши сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button class="send" id="sendBtn">Отправить</button>
    </div>
  </footer>

<script>
(() => {
  const DEFAULTS = {
    // Served by prod nginx at /test-chat/: the API is proxied next to the page.
    baseUrl: location.pathname.startsWith('/test-chat')
      ? `${location.origin}/test-chat/api`
      : 'http://localhost:4000/v1',
    apiKey: 'dev-client-key-change-in-prod',
    rn: 'A79C5050-1EE7-11EB-9B6E-05B5FC40DF2A',
    br: 'b8b3d1ac-4d3d-ea11-a958-8b023de8ef69',
    target: 'WEB',
  };
  // Bumped to v2: v1 clients have a stale baseUrl and no apiKey in localStorage,
  // and saved settings win over DEFAULTS.
  const LS_KEY = 'ai-assistant-test-client-v2';

  const $ = (id) => document.getElementById(id);
  const chat = $('chat');

  // session id per page load
  const sessionId = 'test-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

  // ---- settings persistence ----
  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) {}
    const s = { ...DEFAULTS, ...saved };
    $('baseUrl').value = s.baseUrl;
    $('apiKey').value = s.apiKey;
    $('rn').value = s.rn;
    $('br').value = s.br;
    $('target').value = s.target;
    updateStatus();
  }
  function currentSettings() {
    return {
      baseUrl: $('baseUrl').value.trim().replace(/\/+$/, ''),
      apiKey: $('apiKey').value.trim(),
      rn: $('rn').value.trim(),
      br: $('br').value.trim(),
      target: $('target').value,
    };
  }
  // Every client-scoped route is behind AccessKeyGuard (x-api-key header).
  function authHeaders(s, extra) {
    const h = { ...(extra || {}) };
    if (s.apiKey) h['X-API-Key'] = s.apiKey;
    return h;
  }
  function saveSettings() {
    localStorage.setItem(LS_KEY, JSON.stringify(currentSettings()));
    updateStatus();
  }
  function updateStatus() {
    const s = currentSettings();
    $('settingsStatus').textContent = `${s.baseUrl}  ·  br=${s.br.slice(0, 8)}…  ·  ${s.target}`;
  }
  ['baseUrl', 'apiKey', 'rn', 'br', 'target'].forEach((id) => $(id).addEventListener('change', saveSettings));

  $('settingsToggle').addEventListener('click', () => {
    $('settingsBody').classList.toggle('collapsed');
  });

  // ---- rendering ----
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addRow(kind) {
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollDown();
    return { row, bubble };
  }

  function addUser(text) {
    const { bubble } = addRow('user');
    bubble.textContent = text;
  }

  function addSystem(text) {
    const { bubble } = addRow('system');
    bubble.textContent = text;
  }

  function fmtPrice(card) {
    const p = typeof card.price === 'number' ? card.price : card.price;
    return `${p} ${card.currency || ''}`.trim();
  }

  function renderAssistant(data) {
    const { bubble } = addRow('assistant');

    const reply = document.createElement('div');
    reply.textContent = data.reply_text || '(пустой ответ)';
    bubble.appendChild(reply);

    if (data.need_clarification && data.clarification_question) {
      const cl = document.createElement('div');
      cl.className = 'clarify';
      cl.textContent = '❓ ' + data.clarification_question;
      bubble.appendChild(cl);
    }

    if (Array.isArray(data.cards) && data.cards.length) {
      const wrap = document.createElement('div');
      wrap.className = 'cards';
      data.cards.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'card';
        if (c.image_url) {
          const img = document.createElement('img');
          img.src = c.image_url; img.alt = c.name || '';
          img.onerror = () => { img.style.display = 'none'; };
          card.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'noimg'; ph.textContent = '🍽';
          card.appendChild(ph);
        }
        const body = document.createElement('div');
        body.className = 'c-body';
        body.innerHTML =
          `<div class="c-name"></div><div class="c-price"></div><div class="c-reason"></div>`;
        body.querySelector('.c-name').textContent = c.name || '(без названия)';
        body.querySelector('.c-price').textContent = fmtPrice(c);
        body.querySelector('.c-reason').textContent = c.reason || '';
        card.appendChild(body);
        wrap.appendChild(card);
      });
      bubble.appendChild(wrap);
    }

    if (Array.isArray(data.quick_replies) && data.quick_replies.length) {
      const chips = document.createElement('div');
      chips.className = 'chips';
      data.quick_replies.forEach((q) => {
        const chip = document.createElement('button');
        chip.className = 'chip'; chip.textContent = q;
        chip.addEventListener('click', () => { $('msg').value = q; sendMessage(); });
        chips.appendChild(chip);
      });
      bubble.appendChild(chips);
    }

    if (data.debug !== undefined && data.debug !== null) {
      const d = document.createElement('details');
      d.className = 'debug';
      const sum = document.createElement('summary');
      sum.textContent = 'debug' + (data.request_id ? ` · ${data.request_id}` : '');
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(data.debug, null, 2);
      d.appendChild(sum); d.appendChild(pre);
      bubble.appendChild(d);
    }
    scrollDown();
  }

  // ---- networking ----
  let busy = false;
  function setBusy(v) {
    busy = v;
    $('sendBtn').disabled = v;
    $('sendBtn').textContent = v ? '…' : 'Отправить';
  }

  async function postAnswer(payloadExtra) {
    const s = currentSettings();
    if (!s.baseUrl) { addSystem('Не задан Base URL.'); return; }
    if (!s.rn || !s.br) { addSystem('Нужны rn и br в настройках.'); return; }

    const body = {
      rn: s.rn, br: s.br, target: s.target,
      session_id: sessionId, channel: 'test-client',
      ...payloadExtra,
    };

    const { bubble } = addRow('assistant');
    bubble.classList.remove('bubble');
    bubble.className = 'bubble typing';
    bubble.textContent = 'печатает…';

    setBusy(true);
    try {
      const res = await fetch(`${s.baseUrl}/assistant/product-answer`, {
        method: 'POST',
        headers: authHeaders(s, { 'Content-Type': 'application/json' }),
        body: JSON.stringify(body),
      });
      const text = await res.text();
      bubble.parentElement.remove(); // remove typing placeholder
      let data;
      try { data = JSON.parse(text); } catch (_) {
        addSystem(`HTTP ${res.status}: ответ не JSON:\n${text.slice(0, 500)}`);
        return;
      }
      if (!res.ok) {
        addSystem(`HTTP ${res.status}:\n${JSON.stringify(data, null, 2)}`);
        return;
      }
      renderAssistant(data);
    } catch (e) {
      bubble.parentElement.remove();
      addSystem('Ошибка запроса (сеть/CORS). Проверь, что backend запущен и enableCors() включён.\n' + e);
    } finally {
      setBusy(false);
    }
  }

  function sendMessage() {
    if (busy) return;
    const text = $('msg').value.trim();
    if (!text) return;
    $('msg').value = '';
    autoGrow();
    addUser(text);
    postAnswer({ user_message: text });
  }

  function sendSuggestion(id, label) {
    if (busy) return;
    addUser('🔘 ' + label);
    postAnswer({ suggestion_id: id });
  }

  // ---- presets ----
  async function loadPresets() {
    const s = currentSettings();
    $('presetStatus').textContent = 'загрузка…';
    try {
      const url = `${s.baseUrl}/assistant/suggestions?rn=${encodeURIComponent(s.rn)}&br=${encodeURIComponent(s.br)}&target=${encodeURIComponent(s.target)}&screen_context=catalog`;
      const res = await fetch(url, { headers: authHeaders(s) });
      const data = await res.json();
      const list = data.suggestions || [];
      $('presetStatus').textContent = `${list.length} пресетов`;
      if (!list.length) return;
      const { bubble } = addRow('assistant');
      bubble.textContent = 'Пресеты:';
      const chips = document.createElement('div');
      chips.className = 'chips';
      list.forEach((sg) => {
        const id = sg.id || sg.suggestion_id;
        const label = sg.title || sg.label || sg.text || id;
        const chip = document.createElement('button');
        chip.className = 'chip preset'; chip.textContent = label;
        chip.addEventListener('click', () => sendSuggestion(id, label));
        chips.appendChild(chip);
      });
      bubble.appendChild(chips);
      scrollDown();
    } catch (e) {
      $('presetStatus').textContent = '';
      addSystem('Не удалось загрузить пресеты: ' + e);
    }
  }

  // ---- input UX ----
  function autoGrow() {
    const ta = $('msg');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  }
  $('msg').addEventListener('input', autoGrow);
  $('msg').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('sendBtn').addEventListener('click', sendMessage);
  $('loadPresets').addEventListener('click', loadPresets);
  $('clearChat').addEventListener('click', () => { chat.innerHTML = ''; });

  loadSettings();
})();
</script>
</body>
</html>
