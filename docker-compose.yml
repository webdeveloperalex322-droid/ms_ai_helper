version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_assistant_postgres
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: ai_assistant
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assistant -d ai_assistant']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_assistant_app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://assistant:assistant@postgres:5432/ai_assistant
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
