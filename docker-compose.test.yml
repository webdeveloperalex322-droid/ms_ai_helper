version: '3.9'

services:
  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: ai_assistant_postgres_test
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: ai_assistant_test
    ports:
      - '5433:5432'
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assistant -d ai_assistant_test']
      interval: 3s
      timeout: 3s
      retries: 10
